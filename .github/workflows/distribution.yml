name: Build and release distribution

on:
  push:
    # Tags can restore default-branch caches, but not another tag's cache.
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      SLINT_VERSION: '1.18.1'
      RUST_TOOLCHAIN: '1.99.1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read build settings
        run: |
          $version = '0.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              if ($env:GITHUB_REF_NAME -cnotmatch '^v(\d+\.\d+\.\d+(?:\.\d+)?)$') {
                  throw 'Use vMAJOR.MINOR.PATCH (or vMAJOR.MINOR.PATCH.REVISION), as required by the updater.'
              }
              $version = $Matches[1]
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "CARGO_BUILD_JOBS=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV
          "CMAKE_BUILD_PARALLEL_LEVEL=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV

      # Cache the installed SDK (compiler, headers, DLL and import library), not
      # the app or a CMake build tree with runner-specific paths/timestamps.
      # The workflow hash invalidates the SDK when its build options change.
      - name: Cache Slint SDK
        id: slint-cache
        uses: actions/cache@v6
        with:
          path: build/slint-sdk
          key: slint-sdk-v1-windows-2022-${{ runner.arch }}-vs2022-${{ env.SLINT_VERSION }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.github/workflows/distribution.yml') }}

      - name: Check out pinned Slint source
        if: steps.slint-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: slint-ui/slint
          ref: v${{ env.SLINT_VERSION }}
          path: build/deps/slint
          persist-credentials: false

      - name: Set up Rust
        if: steps.slint-cache.outputs.cache-hit != 'true'
        run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --no-self-update

      - name: Configure Slint SDK
        if: steps.slint-cache.outputs.cache-hit != 'true'
        run: >-
          cmake -S build/deps/slint/api/cpp -B build/slint-build -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/build/slint-sdk"
          "-DRust_TOOLCHAIN=$env:RUST_TOOLCHAIN"
          -DBUILD_SHARED_LIBS=ON
          -DSLINT_BUILD_TESTING=OFF
          -DSLINT_FEATURE_BACKEND_QT=OFF
          -DSLINT_FEATURE_RENDERER_SKIA=OFF
          -DSLINT_FEATURE_RENDERER_SOFTWARE=ON

      - name: Build Slint SDK
        if: steps.slint-cache.outputs.cache-hit != 'true'
        run: cmake --build build/slint-build --config Release

      - name: Install Slint SDK
        if: steps.slint-cache.outputs.cache-hit != 'true'
        run: cmake --install build/slint-build --config Release

      - name: Locate NSIS
        run: |
          $nsis = "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          if (!(Test-Path -LiteralPath $nsis)) {
              throw "NSIS was not found on the Windows runner: $nsis"
          }
          "NSIS_EXECUTABLE=$nsis" >> $env:GITHUB_ENV

      - name: Configure Release
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DSCRCPY_VERSION=$env:RELEASE_VERSION"
          "-DSlint_DIR=$env:GITHUB_WORKSPACE/build/slint-sdk/lib/cmake/Slint"
          -DCMAKE_REQUIRE_FIND_PACKAGE_Slint=ON
          "-DSCRCPY_MAKENSIS_EXECUTABLE=$env:NSIS_EXECUTABLE"
          -DBUILD_TESTING=ON
          -DSLINT_FEATURE_RENDERER_SOFTWARE=ON

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run tests
        env:
          SLINT_BACKEND: winit-software
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package portable ZIP
        if: startsWith(github.ref, 'refs/tags/')
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP -B build/packages

      - name: Package installer
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          cpack --config build/CPackConfig.cmake -C Release -G NSIS -B build/packages
          "-DCPACK_NSIS_EXECUTABLE=$env:NSIS_EXECUTABLE"

      - name: Write checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $packages = @(
              'build/packages/scrcpy-gui-windows-x64.zip',
              'build/packages/scrcpy-gui-windows-x64.exe'
          )
          $checksums = foreach ($package in $packages) {
              $hash = Get-FileHash -LiteralPath $package -Algorithm SHA256
              '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), (Split-Path $package -Leaf)
          }
          # LF line endings let the Linux release job verify this Windows output.
          ($checksums -join "`n") + "`n" | Set-Content -LiteralPath build/packages/SHA256SUMS.txt -Encoding utf8 -NoNewline

      - name: Upload distribution
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-gui-${{ github.ref_name }}-windows-x64
          path: |
            build/packages/scrcpy-gui-windows-x64.zip
            build/packages/scrcpy-gui-windows-x64.exe
            build/packages/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload test logs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.ref_name }}-windows-x64
          path: |
            build/Testing/Temporary/
            build/ui-previews/
          if-no-files-found: ignore

  # Built on the oldest supported Ubuntu runner so the glibc baseline stays low;
  # the tarball runs on newer distributions such as Arch.
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      SLINT_VERSION: '1.18.1'
      RUST_TOOLCHAIN: '1.99.1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read build settings
        run: |
          version=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
              echo 'Use vMAJOR.MINOR.PATCH (or vMAJOR.MINOR.PATCH.REVISION), as required by the updater.' >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config \
            libsystemd-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev

      - name: Cache Slint SDK
        id: slint-cache
        uses: actions/cache@v6
        with:
          path: build/slint-sdk
          key: slint-sdk-v1-ubuntu-22.04-${{ runner.arch }}-${{ env.SLINT_VERSION }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.github/workflows/distribution.yml') }}

      - name: Check out pinned Slint source
        if: steps.slint-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: slint-ui/slint
          ref: v${{ env.SLINT_VERSION }}
          path: build/deps/slint
          persist-credentials: false

      - name: Set up Rust
        if: steps.slint-cache.outputs.cache-hit != 'true'
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update

      # Same lean feature set as a local Linux build: winit with the software
      # renderer only, so the app never loads GL drivers or Qt.
      - name: Configure Slint SDK
        if: steps.slint-cache.outputs.cache-hit != 'true'
        run: >-
          cmake -S build/deps/slint/api/cpp -B build/slint-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/build/slint-sdk"
          "-DRust_TOOLCHAIN=$RUST_TOOLCHAIN"
          -DBUILD_SHARED_LIBS=ON
          -DSLINT_BUILD_TESTING=OFF
          -DSLINT_FEATURE_BACKEND_QT=OFF
          -DSLINT_FEATURE_RENDERER_SKIA=OFF
          -DSLINT_FEATURE_RENDERER_FEMTOVG=OFF
          -DSLINT_FEATURE_RENDERER_SOFTWARE=ON

      - name: Build Slint SDK
        if: steps.slint-cache.outputs.cache-hit != 'true'
        run: cmake --build build/slint-build

      - name: Install Slint SDK
        if: steps.slint-cache.outputs.cache-hit != 'true'
        run: cmake --install build/slint-build

      - name: Configure Release
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DSCRCPY_VERSION=$RELEASE_VERSION"
          "-DSlint_DIR=$GITHUB_WORKSPACE/build/slint-sdk/lib/cmake/Slint"
          -DCMAKE_REQUIRE_FIND_PACKAGE_Slint=ON
          -DBUILD_TESTING=ON
          -DSLINT_FEATURE_RENDERER_SOFTWARE=ON

      - name: Build Release
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # The updater installs this flat tarball (bin/, lib/, share/) in place.
      - name: Package tarball
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cpack --config build/CPackConfig.cmake -G TGZ -B build/packages
          cd build/packages && sha256sum scrcpy-gui-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Upload distribution
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-gui-${{ github.ref_name }}-linux-x64
          path: |
            build/packages/scrcpy-gui-linux-x64.tar.gz
            build/packages/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload test logs and previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.ref_name }}-linux-x64
          path: |
            build/Testing/Temporary/
            build/ui-previews/
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download tested Windows distribution
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-gui-${{ github.ref_name }}-windows-x64
          path: windows

      - name: Download tested Linux distribution
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-gui-${{ github.ref_name }}-linux-x64
          path: linux

      - name: Verify and combine distribution checksums
        run: |
          (cd windows && sha256sum --check SHA256SUMS.txt)
          (cd linux && sha256sum --check SHA256SUMS.txt)
          mkdir packages
          mv windows/scrcpy-gui-windows-x64.zip windows/scrcpy-gui-windows-x64.exe linux/scrcpy-gui-linux-x64.tar.gz packages/
          cat windows/SHA256SUMS.txt linux/SHA256SUMS.txt > packages/SHA256SUMS.txt
          (cd packages && sha256sum --check SHA256SUMS.txt)

      # gh uploads all assets to a draft before publishing the stable release.
      # The updaters use releases/latest and the ZIP's or tarball's GitHub digest.
      - name: Publish release with distribution assets
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          packages/scrcpy-gui-windows-x64.zip
          packages/scrcpy-gui-windows-x64.exe
          packages/scrcpy-gui-linux-x64.tar.gz
          packages/SHA256SUMS.txt
          --verify-tag
          --title "scrcpy-gui $GITHUB_REF_NAME"
          --generate-notes
